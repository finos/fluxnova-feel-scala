name: "Java setup"
description: "Common steps for Java setup"
runs:
  using: "composite"
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'
        server-id: ossrh
        server-username: ${{ env.CI_DEPLOY_USERNAME }}
        server-password: ${{ env.CI_DEPLOY_PASSWORD }}

    # Pin Maven to 3.9.x: Maven 3.10.0 (now default on ubuntu-latest) writes
    # maven-metadata-local.xml into the staging repo, which central-publishing-maven-plugin
    # 0.11.0 fails to clean up, causing spurious "Bundle has content that does NOT have
    # a .pom file" deployment failures. See:
    # https://github.com/mavenplugins/central-publishing-maven-plugin/issues/79
    - name: Set up Maven
      uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
      with:
        maven-version: 3.10.0

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      env:
        cache-name: cache-mvn-deps
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Check Java version
      shell: bash
      run: |
        java -version
        mvn --version